# =============================================================================
# AssetDock — Self-Hosted Deployment (Developer Build)
# =============================================================================
# This file builds the API and Web images locally from source.
# Intended for contributors and maintainers working on the codebase.
#
# For production self-hosted deployments (end users / customers), use:
#   docker-compose.client.yml — pulls pre-built images, no compilation needed.
#
# Usage:
#   1. cp .env.selfhosted.example .env.selfhosted  (then edit values)
#   2. docker compose -f docker-compose.selfhosted.yml --env-file .env.selfhosted up -d
#   3. Open http://localhost:3000 — setup wizard runs on first access
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Database — PostgreSQL 17
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: assetdock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetdock}
      POSTGRES_USER: ${POSTGRES_USER:-assetdock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assetdock_db_pass_2026}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetdock} -d ${POSTGRES_DB:-assetdock}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assetdock

  # ---------------------------------------------------------------------------
  # Backend API — Spring Boot 3.5 / Java 21 (built from source)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assetdock-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-assetdock}
      DB_USERNAME: ${POSTGRES_USER:-assetdock}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-assetdock_db_pass_2026}
      JWT_SECRET: ${JWT_SECRET:-this-is-a-secure-selfhosted-jwt-secret-key-2026-assetdock}
      JWT_ISSUER: ${JWT_ISSUER:-assetdock-api}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORTFOLIO_SEED_ENABLED: ${PORTFOLIO_SEED_ENABLED:-false}
      WEB_SESSION_SECURE_COOKIES: ${WEB_SESSION_SECURE_COOKIES:-false}
      WEB_SESSION_COOKIE_SAME_SITE: ${WEB_SESSION_COOKIE_SAME_SITE:-Lax}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - assetdock

  # ---------------------------------------------------------------------------
  # Frontend Web — React / nginx (built from source)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../assetdock-web
      dockerfile: Dockerfile
    container_name: assetdock-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - assetdock

volumes:
  postgres-data:

networks:
  assetdock:
    driver: bridge
